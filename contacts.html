<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciel Privé — Контакты</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Inter:wght@400;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; font-size: 16px; background: #fff; color: #000b1c; }
    a { text-decoration: none; color: inherit; }
    .page { display: flex; flex-direction: column; width: 100%; min-height: 100vh; position: relative; }

    /* HEADER */
    .header { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 1108px; display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 10px 22px; background: rgba(181,212,255,0.4); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; z-index: 100; }
    .header__logo { font-weight: 700; font-size: 20px; color: #000; white-space: nowrap; }
    .header__nav { display: flex; align-items: center; gap: 15px; font-size: 20px; color: #000; }
    .header__nav a:hover { color: #003c93; }
    .header__btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 16px; background: #003c93; border-radius: 2px; font-size: 24px; color: #fff; white-space: nowrap; }
    .header__burger { display: none; flex-direction: column; justify-content: space-between; width: 32px; height: 18px; cursor: pointer; background: none; border: none; padding: 0; }
    .header__burger span { display: block; width: 100%; height: 1px; background: #000; }

    /* HERO */
    .hero { position: relative; width: 100%; height: 600px; overflow: hidden; }
    .hero__bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
    .hero__overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); }
    .hero__content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 70px 20px 40px; gap: 20px; }
    .hero__title { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 47.78px; color: #b5d4ff; max-width: 600px; line-height: normal; white-space: nowrap; }
    .hero__subtitle { font-size: 16px; color: #fff; max-width: 600px; line-height: 1.5; }

    /* FORM SECTION */
    .form-section { background: #e3e3e3; width: 100%; }
    .form-section__inner { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 16px; }
    .form-wrap { display: flex; flex-direction: column; gap: 45px; width: 100%; max-width: 856px; }
    .fields-grid { display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; justify-content: center; width: 100%; }
    .field { display: flex; flex-direction: column; gap: 12px; width: 400px; }
    .field label { font-size: 16px; color: #000; }
    .field input, .field textarea {
      width: 100%;
      background: #fff;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      padding: 10px 17px;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      color: #000;
      outline: none;
    }
    .field input { height: 39px; }
    .field textarea { height: 80px; resize: vertical; }
    .field input::placeholder, .field textarea::placeholder { color: rgba(0,0,0,0.3); }
    .field--pax input { width: 120px; text-align: center; }
    .submit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      background: #003c93;
      border-radius: 4px;
      font-size: 20px;
      color: #fff;
      width: 350px;
      border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }

    /* FOOTER */
    .footer { background: #e3e3e3; width: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 40px; padding: 40px 20px; font-size: 16px; color: #000b1c; text-align: center; }

    @media (max-width: 1023px) {
      .header { width: auto; left: 10px; right: 10px; transform: none; height: 44px; padding: 10px; border-radius: 10px; }
      .header__nav, .header__btn { display: none; }
      .header__burger { display: flex; }
      .hero__content { align-items: flex-start; text-align: left; justify-content: flex-end; padding: 150px 20px 40px; }
      .hero__title { font-size: 32px; white-space: normal; max-width: 100%; }
      .hero__subtitle { max-width: 100%; }
      .fields-grid { flex-direction: column; gap: 40px; align-items: stretch; }
      .field { width: 100%; }
      .submit-btn { width: 100%; }
      .footer { gap: 10px; }
    }
  </style>
</head>
<body>
<div class="page">
  <header class="header">
    <span class="header__logo">Ciel Privé</span>
    <nav class="header__nav">
      <a href="about.html">О сервисе</a>
      <a href="services.html">Услуги</a>
      <a href="route.html">Маршрут</a>
      <a href="before-flight.html">До вылета</a>
      <a href="in-air.html">В воздухе</a>
      <a href="contacts.html">Контакты</a>
    </nav>
    <a href="contacts.html" class="header__btn">Оставить запрос</a>
    <button class="header__burger" aria-label="Меню"><span></span><span></span><span></span></button>
  </header>

  <section class="hero">
    <div class="hero__bg" style="background-image:url('src/imports/ContactsDesktop/5fe97668ef8e3bae313364bd98c3765fd0ab085a.png')"></div>
    <div class="hero__overlay"></div>
    <div class="hero__content">
      <h1 class="hero__title">Связаться с Ciel Privé</h1>
      <p class="hero__subtitle">Опишите маршрут или оставьте контакт, чтобы обсудить подходящий формат поездки.</p>
    </div>
  </section>

  <section class="form-section">
    <div class="form-section__inner">
      <form class="form-wrap" action="#" method="post">
        <div class="fields-grid">
          <div class="field">
            <label for="name">ФИО</label>
            <input type="text" id="name" name="name" placeholder="Иван Иванов Иванович">
          </div>
          <div class="field">
            <label for="phone">Телефон</label>
            <input type="tel" id="phone" name="phone" placeholder="+7 _ _ _  _ _ _-_ _-_ _">
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="yourname@company.com">
          </div>
          <div class="field">
            <label for="dep">Аэропорт вылета</label>
            <input type="text" id="dep" name="dep" placeholder="SVO">
          </div>
          <div class="field">
            <label for="arr">Аэропорт прилета</label>
            <input type="text" id="arr" name="arr" placeholder="DME">
          </div>
          <div class="field">
            <label for="date">Дата</label>
            <input type="text" id="date" name="date" placeholder="ДД.ММ.ГГГГ">
          </div>
          <div class="field">
            <label for="pax">Количество пассажиров</label>
            <input type="number" id="pax" name="pax" min="1" value="1">
          </div>
          <div class="field">
            <label for="comment">Комментарий</label>
            <textarea id="comment" name="comment" placeholder="Дополнительная информация"></textarea>
          </div>
        </div>
        <button type="submit" class="submit-btn">Отправить форму</button>
      </form>
    </div>
  </section>

  <footer class="footer">
    <span>©copyright2026</span>
    <a href="#">договор</a>
    <a href="contacts.html">контакты</a>
    <span>+7 (495) 123-45-67</span>
  </footer>
</div>
</body>
</html>
