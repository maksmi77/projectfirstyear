<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciel Privé — 404</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Inter:wght@400&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cormorant Garamond', serif; font-size: 16px; background: #fff; color: #000b1c; }
    a { text-decoration: none; color: inherit; }
    .page { display: flex; flex-direction: column; width: 100%; min-height: 100vh; text-align: center; }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 100px 20px;
    }

    .num {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: clamp(120px, 30vw, 500px);
      line-height: 1;
      color: #000b1c;
      white-space: nowrap;
    }

    .msg {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: clamp(32px, 8vw, 100px);
      line-height: 1.1;
      color: #000b1c;
    }

    .footer {
      background: #fff;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 40px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      color: #000b1c;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="page">
  <div class="wrapper">
    <p class="num">404</p>
    <p class="msg">Flight not found</p>

  <footer class="footer">

</body>
</html>
